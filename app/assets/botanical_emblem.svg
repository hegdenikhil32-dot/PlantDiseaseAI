<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular subtle framing ring -->
  <circle cx="200" cy="200" r="185" stroke="url(#stemGrad)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.4" />
  <circle cx="200" cy="200" r="172" stroke="url(#leafGrad)" stroke-width="0.8" opacity="0.25" />

  <!-- Botanical Emblem: Monogram 'P' & Organic Leaf Silhouette -->
  <!-- Main stem / vertical bar of the P -->
  <path d="M 145 325 C 145 280, 146 150, 146 85" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 146 325 C 146 310, 138 290, 126 278" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 146 250 C 146 240, 132 225, 118 220" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 146 180 C 146 170, 135 155, 122 150" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Left branching leaves -->
  <path d="M 126 278 C 115 272, 110 255, 116 245 C 122 235, 135 245, 145 260" fill="url(#leafGrad)" opacity="0.4"/>
  <path d="M 118 220 C 108 215, 102 200, 108 190 C 114 182, 128 190, 145 205" fill="url(#leafGrad)" opacity="0.5"/>
  <path d="M 122 150 C 112 145, 108 132, 114 124 C 120 116, 132 125, 146 140" fill="url(#leafGrad)" opacity="0.6"/>

  <!-- Main Leaf Bowl of the 'P' -->
  <!-- Upper loop of P contoured as a lush, elegant leaf -->
  <path d="M 146 85 C 180 82, 280 95, 285 165 C 290 230, 195 245, 146 245" 
        stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <path d="M 146 85 C 190 90, 275 110, 275 165 C 275 220, 190 240, 146 245 C 175 205, 215 170, 260 155 C 210 145, 170 120, 146 85 Z" 
        fill="url(#leafGrad)" opacity="0.35"/>

  <!-- Venation inside the leaf bowl -->
  <!-- Central main rib -->
  <path d="M 146 165 C 185 165, 230 165, 285 165" stroke="url(#stemGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Lateral veins -->
  <path d="M 180 165 C 195 145, 215 130, 240 120" stroke="url(#stemGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 210 165 C 225 150, 245 140, 268 135" stroke="url(#stemGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 180 165 C 195 185, 215 200, 240 210" stroke="url(#stemGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 210 165 C 225 180, 245 190, 268 195" stroke="url(#stemGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Delicate terminal bud / leaf apex -->
  <path d="M 146 85 C 146 65, 155 50, 160 45 C 152 52, 145 68, 145 85" stroke="url(#stemGrad)" stroke-width="2" fill="url(#leafGrad)" opacity="0.8"/>
</svg>
